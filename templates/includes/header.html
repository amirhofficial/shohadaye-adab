<header class="site-header" id="siteHeader">
  <div class="container site-header__bar">
    <a class="brand" href="{% url 'core:home' %}" aria-label="مدرسه شهدای ادب — صفحه اصلی">
      <svg class="brand__mark" aria-hidden="true"><use href="#i-logo"/></svg>
      <span class="brand__text">
        <span class="brand__name">مدرسه شهدای ادب</span>
        <span class="brand__tag">دانش، اخلاق، آینده‌ای روشن</span>
      </span>
    </a>

    <nav class="nav-desktop" aria-label="منوی اصلی">
      <ul>
        <li><a href="{% url 'core:home' %}#top" data-spy aria-current="page">صفحه اصلی</a></li>
        <li><a href="{% url 'core:home' %}#about" data-spy>درباره مدرسه</a></li>
        <li><a href="{% url 'core:home' %}#news" data-spy>اخبار و اطلاعیه‌ها</a></li>
        <li><a href="{% url 'core:home' %}#achievements" data-spy>افتخارات</a></li>
        <li><a href="{% url 'core:home' %}#gallery" data-spy>گالری تصاویر</a></li>
        <li><a href="{% url 'core:home' %}#contact" data-spy>ارتباط با ما</a></li>
      </ul>
    </nav>

    <button class="search-trigger" type="button" data-search-open aria-haspopup="dialog">
      <svg class="icon icon--sm" aria-hidden="true"><use href="#i-search"/></svg>
      <span>جستجو در سایت…</span>
    </button>
    <button class="icon-btn search-icon-btn" type="button" data-search-open aria-haspopup="dialog" aria-label="جستجو در سایت">
      <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
    </button>

    <a class="btn btn--primary btn-student" href="{{ student_panel_url|default:'#student-panel' }}">
      <svg class="icon icon--sm" aria-hidden="true"><use href="#i-login"/></svg>
      پنل دانش‌آموزی
    </a>

    <button class="icon-btn nav-toggle" type="button" data-menu-toggle aria-expanded="false" aria-controls="menuSheet" aria-label="باز و بسته کردن منو">
      <svg class="icon icon-open" aria-hidden="true"><use href="#i-menu"/></svg>
      <svg class="icon icon-close" aria-hidden="true"><use href="#i-close"/></svg>
    </button>
  </div>
</header>
